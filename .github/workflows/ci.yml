name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        # Tests that need a downloaded corpus are skipped; everything else runs against
        # the datasets bundled with scikit-learn.
        env:
          CLASSICAL_ML_OFFLINE: "1"
        run: pytest -m "not needs_data" -q

      - name: Run the projects that need no download
        env:
          CLASSICAL_ML_OFFLINE: "1"
          CLASSICAL_ML_OUTPUTS: ${{ runner.temp }}/outputs
        run: python -m classical_ml diagnosis timeseries
